name: Ration

options:
  minimumXcodeGenVersion: 2.45.0
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES

targets:
  Ration:
    type: application
    platform: macOS
    sources:
      - path: Ration
        excludes:
          - Ration.entitlements
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: agency.izzy.ration
        PRODUCT_NAME: Ration
        PRODUCT_MODULE_NAME: Ration
        MARKETING_VERSION: "1.6.0"
        CURRENT_PROJECT_VERSION: 87
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ration
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 IZZY.Agency"
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_ENTITLEMENTS: Ration/Ration.entitlements
        CODE_SIGN_STYLE: Automatic
        # IZZY Agency (company team). A free personal team cannot sign with a
        # Developer ID or notarize, so this has to stay the company team.
        DEVELOPMENT_TEAM: VHZR49D9QB
        # Required by notarization. Nothing in the app needs an exception
        # (no JIT, dlopen, Apple Events or third-party frameworks).
        ENABLE_HARDENED_RUNTIME: YES
        # Localization: English source, French and Ukrainian translations in
        # Ration/Resources/Localizable.xcstrings. Symbols are generated for the
        # catalog's manually-managed keys (`LocalizedStringResource.commonSystem`).
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
      configs:
        # Release archives sign straight with the Developer ID (see
        # scripts/release.sh). Automatic signing would first demand an Apple
        # Development cert for the team that the archive then throws away.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application

  RationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RationTests
    dependencies:
      - target: Ration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: agency.izzy.ration.Tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ration.app/Contents/MacOS/Ration"
        BUNDLE_LOADER: "$(TEST_HOST)"

  RationUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: RationUITests
    dependencies:
      - target: Ration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: agency.izzy.ration.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Ration

schemes:
  Ration:
    build:
      targets:
        Ration: all
        RationTests: [test]
        RationUITests: [test]
    test:
      # The English regression run, whatever the Mac's own language order:
      # Xcode's Cmd-U draws English, as `make unit-test` and `make test` do.
      # French and Ukrainian run through `make l10n-test`. (This is the only
      # "Ration" scheme: a target-level `scheme:` on Ration would generate a
      # scheme of the same name and silently replace this one.)
      language: en
      targets:
        - RationTests
        - RationUITests
