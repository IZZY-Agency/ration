name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: identity gate, build, unit tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode on the runner
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          "$xcode/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: make generate

      - name: Identity gate
        run: scripts/verify-ration-identity.sh

      - name: Build
        run: make build

      - name: Unit tests
        run: make unit-test
